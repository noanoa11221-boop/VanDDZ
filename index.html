<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VanDDZ - Deck Builder & Game</title>
    <style>
        body { margin:0; padding:0; background:#121212; color:#fff; font-family:sans-serif; user-select:none; }
        
        /* เมนูสลับหน้าจอ */
        #nav-menu { display: flex; background: #1e1e1e; border-bottom: 2px solid #333; height: 50px; }
        .nav-btn { flex: 1; border: none; background: transparent; color: #888; font-size: 14px; font-weight: bold; }
        .nav-btn.active { color: #007bff; border-bottom: 3px solid #007bff; background: #252525; }

        /* ส่วนหน้าจอจัดเด็ค */
        .screen { display: none; padding: 10px; box-sizing: border-box; height: calc(100vh - 50px); overflow-y: auto; }
        .screen.active { display: block; }

        /* ตารางแสดงการ์ดในคลัง */
        .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding-bottom: 80px; }
        .deck-card { background: #1a252f; border-radius: 6px; padding: 5px; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid #34495e; text-align: center; }
        .deck-card img { width: 100%; height: auto; border-radius: 4px; }
        .card-title { font-size: 9px; font-weight: bold; margin-top: 4px; height: 24px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-grade { font-size: 8px; color: #ffcc00; font-weight: bold; }
        
        /* ปุ่มบวกลบการ์ด */
        .counter-box { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 5px; background: #111; border-radius: 4px; padding: 2px; }
        .count-btn { background: #007bff; border: none; color: white; width: 20px; height: 20px; border-radius: 3px; font-weight: bold; font-size: 12px; }
        .count-num { font-size: 11px; font-weight: bold; color: #fff; }

        /* แถบสรุปจำนวนเด็คด้านล่าง */
        #deck-summary { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; border-top: 2px solid #007bff; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        
        /* หน้าจอสนามแข่ง (โค้ดดั้งเดิมแต่จัดหน้าใหม่) */
        #game-board { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; height:45vh; box-sizing:border-box; }
        .zone { background:#222; border:2px dashed #444; border-radius:8px; display:flex; justify-content:center; align-items:center; position:relative; font-size:12px; color:#666; font-weight: bold;}
        .zone.active { border-color:#00ff00; background:#1a331a; color:#00ff00; }
        #player-hand { display:flex; overflow-x:auto; padding:10px; background:#0a0a0a; height:25vh; box-sizing:border-box; gap:8px; border-top:2px solid #333; }
        #controls { height:15vh; display:flex; justify-content:space-around; align-items:center; background:#181818; padding:0 10px; }
        
        /* สไตล์ตัวการ์ดในสนาม */
        .card-in-game { width:70px; height:100px; background:#34495e; border-radius:6px; flex-shrink:0; border:2px solid transparent; display:flex; flex-direction:column; justify-content:space-between; padding:4px; box-sizing:border-box; background-size:100% 100%; }
        .card-in-game.selected { border-color:#ffcc00; box-shadow:0 0 10px #ffcc00; }
        .cig-name { font-size:7px; font-weight:bold; background:rgba(0,0,0,0.8); text-align:center; padding:1px; border-radius:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
        .cig-meta { font-size:8px; display:flex; justify-content:space-between; background:rgba(0,0,0,0.8); padding:1px 3px; border-radius:2px; color:#ffcc00;}

        #loading-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:999; font-size:16px; }
    </style>
</head>
<body>

    <div id="loading-screen">กำลังโหลดคลังการ์ดจาก Google Sheets...</div>

    <!-- เมนูด้านบนสำหรับสลับหน้าจอในมือถือ -->
    <nav id="nav-menu">
        <button class="nav-btn active" onclick="switchScreen('builder')">🔨 จัดเด็คการ์ด</button>
        <button class="nav-btn" onclick="switchScreen('game')">⚔️ สนามแข่งขัน</button>
    </nav>

    <!-- หน้าจอที่ 1: Deck Builder -->
    <div id="builder-screen" class="screen active">
        <div style="margin-bottom:10px; font-size:12px; color:#aaa;">จิ้มปุ่ม + เพื่อเลือกการ์ดเข้าเด็คของคุณ (สูงสุดห้ามเกิน 50 ใบตามกฎ)</div>
        <div class="deck-grid" id="card-catalog"></div>
        <div id="deck-summary">
            <div>รวมการ์ดในเด็ค: <span id="total-cards" style="color:#007bff; font-weight:bold;">0</span> / 50 ใบ</div>
            <button onclick="saveDeckAndPrepareGame()" style="padding:8px 15px; background:#28a745; color:white; border:none; border-radius:4px; font-weight:bold; font-size:12px;">ใช้งานเด็คนี้ ➔</button>
        </div>
    </div>

    <!-- หน้าจอที่ 2: สนามแข่ง -->
    <div id="game-screen" class="screen">
        <div id="game-board">
            <div class="zone" id="Left-Rear">Rear Left</div>
            <div class="zone" id="Vanguard">Vanguard</div>
            <div class="zone" id="Right-Rear">Rear Right</div>
        </div>
        <div id="controls">
            <button onclick="drawCard()" style="padding:10px 14px;">จั่ว (Draw)</button>
            <div style="text-align:center; font-size:12px;">
                <div>ในกองเหลือ: <span id="deck-count" style="color:#ffcc00; font-weight:bold;">0</span> ใบ</div>
                <div id="nation-info" style="font-size:10px; color:#aaa; margin-top:3px;">เนชั่น: -</div>
            </div>
            <button onclick="triggerCheck()" style="background:#dc3545; padding:10px 14px;">ไดร์ฟ (Drive)</button>
        </div>
        <div id="player-hand"></div>
    </div>

    <script>
        const SHEET_ID = '18AalJyIOhiTjlvfyV8D4gN2hJERgbCo4NUE7meDRijs';
        const CSV_URL = `https://google.com{SHEET_ID}/export?format=csv`;

        let cardDatabase = [];
        let currentDeckList = {}; // เก็บไอดีการ์ดและจำนวนที่เลือก เช่น {"D-BT01/001": 4}
        let playDeck = []; // กองการ์ดจริงที่จะใช้เล่นในสนาม
        let hand = [];
        let selectedCard = null;

        // สลับหน้าจอไปมาบนมือถือ
        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if(screenName === 'builder') {
                document.getElementById('builder-screen').classList.add('active');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            } else {
                document.getElementById('game-screen').classList.add('active');
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
            }
        }

        // โหลดข้อมูลการ์ดจาก Google Sheets
        async function initCatalog() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                cardDatabase = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*\$)/);
                    if(cols.length >= 3) {
                        return {
                            id: cols[0]?.replace(/"/g, '').trim(),
                            name: cols[1]?.replace(/"/g, '').trim(),
                            grade: cols[2]?.replace(/"/g, '').trim() || "0",
                            nation: cols[3]?.replace(/"/g, '').trim() || "Unknown",
                            type: cols[4]?.replace(/"/g, '').trim() || "Normal",
                            rarity: cols[5]?.replace(/"/g, '').trim() || ""
                        };
                    }
                }).filter(c => c && c.name);

                renderCatalog();
                document.getElementById('loading-screen').style.display = 'none';
            } catch (e) {
                document.getElementById('loading-screen').innerText = 'เกิดข้อผิดพลาดในการดึงข้อมูลการ์ด';
            }
        }

        // วาดรายการคลังการ์ดทั้งหมดให้เลือกบวกลบบนจอ
        function renderCatalog() {
            const catalogDiv = document.getElementById('card-catalog');
            catalogDiv.innerHTML = '';
            
            cardDatabase.forEach(card => {
                const count = currentDeckList[card.id] || 0;
                const cardEl = document.createElement('div');
                cardEl.className = 'deck-card';
                
                // ใช้สีการ์ดแยกตามเกรดเพื่อความชัดเจนแทนรูปภาพชั่วคราว
                let bgColors = ["#27ae60", "#2980b9", "#8e44ad", "#d35400"];
                let bg = bgColors[parseInt(card.grade)] || "#34495e";

                cardEl.innerHTML = `
                    <div style="width:100%; height:70px; background:${bg}; border-radius:4px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:12px;">G${card.grade}</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-grade">${card.nation}</div>
                    <div class="counter-box">
                        <button class="count-btn" onclick="updateCardCount('${card.id}', -1)">-</button>
                        <span class="count-num" id="count-${card.id}">${count}</span>
                        <button class="count-btn" onclick="updateCardCount('${card.id}', 1)">+</button>
                    </div>
                `;
                catalogDiv.appendChild(cardEl);
            });
        }
