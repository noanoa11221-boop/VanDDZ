<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VanDDZ - Mobile Game</title>
    <style>
        body { margin:0; padding:0; background:#121212; color:#fff; font-family:sans-serif; overflow:hidden; user-select:none; }
        #game-board { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:10px; height:55vh; box-sizing:border-box; }
        .zone { background:#222; border:2px dashed #444; border-radius:8px; display:flex; justify-content:center; align-items:center; position:relative; font-size:12px; }
        .zone.active { border-color:#00ff00; background:#1a331a; }
        #player-hand { display:flex; overflow-x:auto; padding:10px; background:#0a0a0a; height:30vh; box-sizing:border-box; gap:8px; border-top:2px solid #333; }
        .card { width:75px; height:108px; background:#333; border-radius:6px; flex-shrink:0; border:2px solid transparent; background-size:cover; background-position:center; position:relative; }
        .card.selected { border-color:#ffcc00; box-shadow:0 0 10px #ffcc00; }
        .card .card-info { position:absolute; bottom:0; width:100%; background:rgba(0,0,0,0.8); font-size:9px; text-align:center; padding:2px 0; }
        #controls { height:15vh; display:flex; justify-content:space-around; align-items:center; background:#181818; padding:0 10px; border-top:1px solid #222; }
        button { padding:12px 18px; background:#007bff; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:bold; }
        button:active { background:#0056b3; }
    </style>
</head>
<body>

    <div id="game-board">
        <div class="zone" id="Left-Rear">Rear Left</div>
        <div class="zone" id="Vanguard">Vanguard</div>
        <div class="zone" id="Right-Rear">Rear Right</div>
    </div>

    <div id="controls">
        <button onclick="drawCard()">จั่วการ์ด (Draw)</button>
        <div id="game-status" style="text-align:center;">พลังงาน Energy: <span id="energy-val">0</span><br><small>การ์ดในกอง: <span id="deck-count">0</span></small></div>
        <button onclick="triggerCheck()" style="background:#dc3545;">ไดร์ฟ (Drive)</button>
    </div>

    <div id="player-hand"></div>

    <script>
        let selectedCard = null;
        let hand = [];
        
        // ฐานข้อมูลเริ่มต้น (เดี๋ยวเราจะเอาลิงก์จาก Google Sheets มาเชื่อมตรงนี้ทีหลัง)
        let cardDatabase = [
            { id: "1", name: "Bastion", grade: 3, power: 13000, trigger: "None", img: "https://placeholders.dev" },
            { id: "2", name: "Hauras", grade: 0, power: 5000, trigger: "Front", img: "https://placeholders.dev" },
            { id: "3", name: "Heal Trigger", grade: 0, power: 5000, trigger: "Heal", img: "https://placeholders.dev" }
        ];

        function drawCard() {
            let randomCard = cardDatabase[Math.floor(Math.random() * cardDatabase.length)];
            hand.push(randomCard);
            renderHand();
        }

        function renderHand() {
            const handDiv = document.getElementById('player-hand');
            handDiv.innerHTML = '';
            hand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.style.backgroundImage = `url('${card.img}')`;
                cardEl.innerHTML = `<div class="card-info">G${card.grade} / ${card.power}</div>`;
                
                cardEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                    cardEl.classList.add('selected');
                    selectedCard = { card, index };
                    activateZones(true);
                });
                handDiv.appendChild(cardEl);
            });
        }

        function activateZones(active) {
            document.querySelectorAll('.zone').forEach(zone => {
                if(active) zone.classList.add('active');
                else zone.classList.remove('active');
            });
        }

        document.querySelectorAll('.zone').forEach(zone => {
            zone.addEventListener('click', () => {
                if (selectedCard) {
                    zone.innerHTML = `<div class="card" style="background-image: url('${selectedCard.card.img}')"><div class="card-info">${selectedCard.card.name}</div></div>`;
                    hand.splice(selectedCard.index, 1);
                    selectedCard = null;
                    renderHand();
                    activateZones(false);
                }
            });
        });

        function triggerCheck() {
            let checkCard = cardDatabase[Math.floor(Math.random() * cardDatabase.length)];
            if(checkCard.trigger !== "None") {
                alert(`[TRIGGER CHECK!] เช็กได้ ${checkCard.trigger} Trigger! ระบบล็อกกฎบอกให้บวกพลังเพิ่ม 10000 เรียบร้อย!`);
            } else {
                alert(`Drive Check: ได้การ์ด ${checkCard.name} เกรด ${checkCard.grade} ไม่มีทริกเกอร์`);
            }
        }
    </script>
</body>
</html>
